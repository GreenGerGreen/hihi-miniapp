function tiles(){return `<div class="tiles"><button class="tile" onclick="table='child';go('table')"><span class="emoji">🍕</span><strong>Детский<br>стол</strong></button><button class="tile" onclick="table='adult';go('table')"><span class="emoji">☕</span><strong>Стол<br>родителей</strong></button><button class="tile" onclick="go('fun')"><span class="emoji">🎮</span><strong>Развлечения<br>и программы</strong></button><button class="tile" onclick="go('decor')"><span class="emoji">🎈</span><strong>Оформление<br>и декор</strong></button></div>`}
function countCard(id,name,price,kind,unit='шт.',desc=''){let q=qty(id);return `<div class="panel"><div class="row"><div><h3>${esc(name)}</h3><div class="muted">${esc(desc)}</div></div><span class="price">${rub(price)}</span></div><div class="mini-counter"><span class="pill">В смете: ${q} ${unit}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button onclick="put(${attr(id)},${attr(name)},${price},1,${attr(kind)},{unit:${attr(unit)}})">+</button></div></div></div>`}
function tableRoot(){return navigation('home')+`<h2 class="screen-title">${tabName()}</h2><p class="subtitle">Выберите угощения для праздника</p><div class="tiles" style="margin-top:16px"><button class="tile" onclick="go('pizzaSize')"><span class="emoji">🍕</span><strong>Пицца</strong></button><button class="tile" onclick="go('nuggetQty')"><span class="emoji">🍗</span><strong>Наггетсы</strong></button><button class="tile" onclick="go('drinks')"><span class="emoji">🧃</span><strong>Напитки</strong></button><button class="tile" onclick="go('sauceFlavor')"><span class="emoji">🥫</span><strong>Соусы</strong></button></div><div class="section-title"><h2>Еда и угощения</h2></div>${FOODS.map((x,i)=>foodCard(x,i)).join('')}`}
function chooseQuantity(title,after){flow.after=after;return `<span class="step">Количество</span><h2 class="screen-title">${esc(title)}</h2><p class="subtitle">Сколько порций вам нужно?</p>${choice('👧 По количеству детей — '+state.kids+' порций','quantityDone('+state.kids+',true)','+')}${choice('✏️ Указать своё количество',"go('manualQty')",'›')}`}
function quantityDone(n,linked){flow.count=n;flow.linked=linked;if(flow.after==='nugget')go('nuggetSize');else if(flow.after==='sauce'){let name='Соус '+flow.flavor+', 25 г';put(table+'|'+name,name,60,n,table,{linked,unit:'шт.'});go('sauceFlavor')}else if(flow.after==='food'){let x=FOODS[flow.food];put(table+'|'+x[0],x[0],x[1],n,table,{linked,unit:'порц.'});go('table')}else if(flow.after==='juice'||flow.after==='water')go('drinkFlavor');else if(flow.after==='play'){let id='fun|Игровая комната';state.cart[id]={id,name:'Игровая комната',price:150,qty:n,kind:'fun',unit:'чел.',linked,blocks:1,durationStep:30};save();go('fun')}}
function pickQty(i){flow={food:i,after:'food'};go('foodQty')}
function pizzaAdd(i){let name='Пицца «'+PIZZA[i]+'», '+flow.size+' см';put(table+'|'+name,name,flow.price,1,table)}
function drinkPick(i){let name=flow.drink==='juice'?'Сок '+JUICE[i].toLowerCase()+', '+flow.volume:'Вода '+['газированная','негазированная'][i]+', '+flow.volume;let id=table+'|'+name;let n=qty(id)?1:(flow.count||1);put(id,name,flow.price,n,table,{linked:!qty(id)&&!!flow.linked});flow.count=1;flow.linked=false}
function drinkVolume(i){let juice=flow.drink==='juice';flow.volume=juice?(i===0?'0,2 л':'1 л'):(i===0?'0,5 л':'1,5 л');flow.price=juice?(i===0?60:250):(i===0?60:120);flow.count=1;flow.linked=false;if(i===0){flow.after=flow.drink;go('drinkQty')}else go('drinkFlavor')}
function serviceAdd(i){let x=SERVICES[i];if(x[4]==='theme'){go('ages');return}if(x[4]==='play'){flow={after:'play'};go('playQty');return}let id='fun|'+x[0];if(x[4]==='hours'&&qty(id)){changeBlocks(id,1);return}put(id,x[0],x[1],1,'fun',x[4]==='hours'?{unit:'ч.',blocks:1,durationStep:60}:{unit:'шт.'})}
function themeAdd(i){let name='Анимационная программа — '+THEMES[flow.age][i],id='fun|'+name;if(qty(id)){changeBlocks(id,1);return}put(id,name,4500,1,'fun',{unit:'ч.',blocks:1,durationStep:60});go('fun')}
function cartScreen(){let h=navigation('home')+`<h2 class="screen-title">🧾 Моя смета</h2><p class="subtitle">Все выбранные позиции в одном месте</p>`;if(!items().length)h+=`<div class="panel empty"><div class="big">🛒</div><h3>Пока ничего нет</h3><p>Добавьте угощения или развлечения</p><button class="action" onclick="go('home')">Выбрать товары</button></div>`;for(const kind of ['child','adult','fun','decor']){let list=items().filter(x=>x.kind===kind);if(!list.length)continue;h+=`<div class="section-title"><h2>${catLabel(kind)}</h2></div><div class="panel">`;for(const x of list)h+=`<div class="cart-line"><div class="row"><div><strong>${esc(x.name)}</strong><div class="detail">${x.qty} ${esc(x.unit||'шт.')} × ${rub(x.price)}${x.blocks>1?' × '+x.blocks+' периодов':''}</div></div><span class="sum">${rub(x.qty*x.price*(x.blocks||1))}</span></div></div>`;h+='</div>'}h+=`<div class="total-card"><div class="row"><span>Итого за праздник</span><strong>${rub(total())}</strong></div><small>Предварительный расчёт · не является бронированием</small></div><div class="actions"><button class="action soft" onclick="go('editList')">✏️ Изменить</button><button class="action blue" onclick="go('home')">＋ Добавить</button></div><div class="actions"><button class="action light" onclick="go('kidsEdit')">👧 Число детей</button><button class="action danger" onclick="resetAsk()">↻ Начать заново</button></div><button class="action wide" style="margin-top:13px" onclick="go('request')">📨 Отправить заявку</button>`;return h}
function render(){let h='',back='home';if(screen==='welcome'){h=header()+`<div class="wrap"><div class="panel accent" style="margin-top:-12px;position:relative"><h2>🎉 Начнём праздник?</h2><p class="muted">Укажите количество детей — и откроется конструктор</p><label class="field">Количество детей (от 1 до 30)<input id="kidsInput" type="number" min="1" max="30" inputmode="numeric" placeholder="Например, 10"></label><button class="action wide" onclick="setKids(Number(document.getElementById('kidsInput').value))">Собрать праздник ✨</button></div></div>`}else if(screen==='home'){h=`<div class="concept-home"><img class="concept-image" src="assets/home.webp" alt="Хи-Хи — собери идеальный праздник"><button class="hotspot" style="left:1%;top:1%;width:13%;height:7%" aria-label="Начать заново" onclick="resetAsk()"></button><button class="hotspot" style="left:82%;top:1%;width:16%;height:7%" aria-label="Открыть смету" onclick="go('cart')"></button><button class="hotspot" style="left:55%;top:29%;width:12%;height:7%" aria-label="Уменьшить число детей" onclick="setKids(state.kids-1)"></button><span class="concept-kids">${state.kids}</span><button class="hotspot" style="left:77%;top:29%;width:12%;height:7%" aria-label="Увеличить число детей" onclick="setKids(state.kids+1)"></button><button class="hotspot" style="left:3%;top:37%;width:46%;height:15%" aria-label="Меню и угощения" onclick="go('table')"></button><button class="hotspot" style="left:51%;top:37%;width:46%;height:15%" aria-label="Развлечения и программы" onclick="go('fun')"></button><button class="hotspot" style="left:3%;top:52%;width:46%;height:17%" aria-label="Оформление и декор" onclick="go('decor')"></button><button class="hotspot" style="left:51%;top:52%;width:46%;height:17%" aria-label="Стол родителей" onclick="table='adult';go('table')"></button><button class="hotspot" style="left:4%;top:70%;width:92%;height:16%" aria-label="Открыть смету" onclick="go('cart')"></button><span class="concept-total">${rub(total())}</span><button class="hotspot" style="left:8%;top:86%;width:84%;height:10%" aria-label="Оформить заявку" onclick="go('request')"></button></div><div class="concept-access"><button onclick="table='child';go('table')">🍟 Детский стол</button><button onclick="table='adult';go('table')">☕ Стол родителей</button></div>`}else{h='<div class="wrap">';if(screen==='table')h+=tableRoot();else if(screen==='pizzaSize')h+=navigation('table')+`<h2 class="screen-title">🍕 Размер пиццы</h2>${choice('25 см','flow={size:25,price:700};go(\'pizzaFlavor\')','700 ₽')}${choice('30 см','flow={size:30,price:850};go(\'pizzaFlavor\')','850 ₽')}`;else if(screen==='pizzaFlavor'){h+=navigation('pizzaSize')+`<h2 class="screen-title">🍕 Пицца — ${flow.size} см</h2><p class="subtitle">${rub(flow.price)} за штуку</p>`;PIZZA.forEach((name,i)=>{let id=table+'|Пицца «'+name+'», '+flow.size+' см';h+=`<div class="panel"><div class="row"><strong>${esc(name)}</strong><span class="pill">${qty(id)} шт.</span></div><div class="mini-counter"><span class="muted">${rub(flow.price)}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${qty(id)?'':'disabled'}>−</button><b>${qty(id)}</b><button onclick="pizzaAdd(${i})">+</button></div></div></div>`});h+=`<button class="action blue wide" onclick="go('table')">Продолжить выбор</button>`}else if(screen==='nuggetQty')h+=navigation('table')+chooseQuantity('🍗 Наггетсы','nugget');else if(screen==='nuggetSize'){h+=navigation('nuggetQty')+`<h2 class="screen-title">🍗 Наггетсы в порции</h2><p class="subtitle">Выбрано порций: ${flow.count}</p>`;[2,4,6].forEach((n,i)=>h+=choice(n+' шт. в порции',`let name='Наггетсы ${n} шт. в порции';put(table+'|'+name,name,${[80,120,150][i]},flow.count,table,{unit:'порц.',linked:flow.linked});go('table')`,rub([80,120,150][i])))}else if(screen==='foodQty'){let x=FOODS[flow.food];h+=navigation('table')+chooseQuantity('🍽️ '+x[0],'food')}else if(screen==='pancakeFlavor'){h+=navigation('foodQty')+`<h2 class="screen-title">🥞 Топпинг для блинчиков</h2>`;['Шоколад','Клубника','Карамель','Сгущёнка'].forEach(x=>h+=choice(x,`let name='Блинчики с топпингом — '+${'${attr(x)}'};put(table+'|'+name,name,150,flow.count,table,{linked:flow.linked,unit:'порц.'});go('table')`))}else if(screen==='sauceFlavor'){h+=navigation('table')+`<h2 class="screen-title">🥫 Соус</h2><p class="subtitle">25 г · 60 ₽</p>`;['Сырный','Кетчуп','Кисло-сладкий'].forEach(x=>h+=choice(x,`flow={flavor:${attr(x.toLowerCase())},after:'sauce'};go('sauceQty')`))}else if(screen==='sauceQty')h+=navigation('sauceFlavor')+chooseQuantity('🥫 Соус '+flow.flavor,'sauce');else if(screen==='drinks'){h+=navigation('table')+`<h2 class="screen-title">🥤 Напитки</h2>`+choice('🧃 Сок',"flow={drink:'juice'};go('drinkVolume')")+choice('💧 Вода',"flow={drink:'water'};go('drinkVolume')");h+=foodCard(['Чай в чашке',80,'180 мл','🍵',false],0,'drink');if(table==='adult'){h+=foodCard(['Чай в чайничке',300,'900 мл','🫖',false],0,'drink');h+=choice('☕ Кофе — выбрать вид',"go('coffee')")}}else if(screen==='coffee'){h+=navigation('drinks')+`<h2 class="screen-title">☕ Кофе</h2>`;COFFEE.forEach(x=>h+=countCard('adult|'+x[0],x[0],x[1],'adult','шт.',x[2]))}else if(screen==='drinkVolume'){h+=navigation('drinks')+`<h2 class="screen-title">${flow.drink==='juice'?'🧃 Объём сока':'💧 Объём воды'}</h2>`;(flow.drink==='juice'?[['0,2 л',60],['1 л',250]]:[['0,5 л',60],['1,5 л',120]]).forEach((x,i)=>h+=choice(x[0],`drinkVolume(${i})`,rub(x[1])))}else if(screen==='drinkQty'){h+=navigation('drinkVolume')+chooseQuantity('Количество · '+flow.volume,flow.drink)}else if(screen==='drinkFlavor'){h+=navigation('drinkVolume')+`<h2 class="screen-title">${flow.drink==='juice'?'🧃 Сок':'💧 Вода'} — ${flow.volume}</h2><p class="subtitle">${rub(flow.price)} за упаковку</p>`;(flow.drink==='juice'?JUICE:['Газированная','Негазированная']).forEach((f,i)=>{let name=flow.drink==='juice'?'Сок '+f.toLowerCase()+', '+flow.volume:'Вода '+f.toLowerCase()+', '+flow.volume,id=table+'|'+name;h+=`<div class="panel"><div class="row"><strong>${esc(f)}</strong><span class="pill">${qty(id)} шт.</span></div><div class="mini-counter"><span class="muted">${rub(flow.price)}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${qty(id)?'':'disabled'}>−</button><b>${qty(id)}</b><button onclick="drinkPick(${i})">+</button></div></div></div>`});h+=`<button class="action blue wide" onclick="go('table')">Продолжить выбор</button>`}else if(screen==='manualQty'){h+=navigation(flow.after==='nugget'?'nuggetQty':flow.after==='food'?'foodQty':flow.after==='sauce'?'sauceQty':flow.after==='play'?'playQty':'drinkQty')+`<h2 class="screen-title">Укажите количество</h2><label class="field">От 1 до 50<input id="manual" class="field-input" type="number" min="1" max="50" inputmode="numeric" placeholder="Введите число" style="width:100%;padding:15px;border-radius:15px;border:2px solid #dce8ff;margin-top:8px;font-size:18px"></label><button class="action wide" onclick="let n=Number(document.getElementById('manual').value);if(Number.isInteger(n)&&n>=1&&n<=50)quantityDone(n,false);else alert('Введите число от 1 до 50')">Продолжить</button>`}else if(screen==='fun'||screen==='decor'){let fun=screen==='fun',arr=fun?SERVICES:DECOR;h+=navigation('home')+`<h2 class="screen-title">${fun?'🎭 Развлечения':'🎈 Оформление'}</h2><p class="subtitle">Выберите то, что сделает праздник особенным</p>`;arr.forEach((x,i)=>{let id=(fun?'fun':'decor')+'|'+x[0],q=qty(id);h+=`<div class="panel"><div class="product"><div class="product-art">${x[3]}</div><div class="product-text"><h3>${esc(x[0])}</h3><div class="muted">${esc(x[2])}</div><div class="price">${rub(x[1])}</div></div></div><div class="mini-counter"><span class="pill">${q?`В смете: ${q}`:'Не выбрано'}</span><div class="counter">${x[4]==='theme'||x[4]==='play'?`<button class="action soft" style="font-size:12px;width:auto;padding:8px" onclick="serviceAdd(${i})">Выбрать</button>`:`<><button onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button onclick="${fun?`serviceAdd(${i})`:`put(${attr(id)},${attr(x[0])},${x[1]},1,'decor')`}">+</button></>`}</div></div></div>`})}else if(screen==='ages'){h+=navigation('fun')+`<h2 class="screen-title">🎭 Возрастная группа</h2>`;Object.keys(THEMES).forEach(a=>h+=choice(a,`flow.age=${attr(a)};go('themes')`))}else if(screen==='themes'){h+=navigation('ages')+`<h2 class="screen-title">🎭 Тема анимации</h2><p class="subtitle">${esc(flow.age)}</p>`;THEMES[flow.age].forEach((a,i)=>h+=choice(a,`themeAdd(${i})`))}else if(screen==='playQty'){h+=navigation('fun')+chooseQuantity('🧸 Игровая комната','play')}else if(screen==='cart')h+=cartScreen();else if(screen==='editList'){h+=navigation('cart')+`<h2 class="screen-title">✏️ Изменить смету</h2><p class="subtitle">Выберите позицию для редактирования</p>`;items().forEach(x=>h+=choice(x.name,`editId=${attr(x.id)};go('edit')`,x.qty+' '+(x.unit||'шт.')));if(!items().length)h+='<div class="empty">Смета пуста</div>'}else if(screen==='edit'){let x=state.cart[editId];if(!x){go('editList');return}h+=navigation('editList')+`<h2 class="screen-title">${esc(x.name)}</h2><div class="panel"><div class="row"><span class="muted">${rub(x.price)} за единицу</span><span class="price">${rub(x.qty*x.price*(x.blocks||1))}</span></div><div class="mini-counter"><span>Количество</span><div class="counter"><button onclick="change(${attr(editId)},-1)">−</button><b>${x.qty}</b><button onclick="change(${attr(editId)},1)">+</button></div></div>${x.blocks?`<div class="divider"></div><div class="mini-counter"><span>⏱ Время: ${x.blocks*(x.durationStep||30)} мин</span><div class="counter"><button onclick="changeBlocks(${attr(editId)},-1)">−</button><b>${x.blocks}</b><button onclick="changeBlocks(${attr(editId)},1)">+</button></div></div>`:''}</div><button class="action danger wide" onclick="delete state.cart[editId];save();go('editList')">Удалить позицию</button>`}else if(screen==='kidsEdit'){h+=navigation('cart')+`<h2 class="screen-title">👧 Количество детей</h2><label class="field">От 1 до 30<input id="newKids" type="number" min="1" max="30" inputmode="numeric" value="${state.kids}"></label><button class="action wide" onclick="setKids(Number(document.getElementById('newKids').value))">Сохранить и вернуться в смету</button><p class="smallnote">Позиции, выбранные по количеству детей, пересчитаются. Ручные количества сохранятся.</p>`}else if(screen==='request'){h+=navigation('cart')+`<h2 class="screen-title">📨 Оформить заявку</h2><p class="subtitle">Только имя и телефон — ничего лишнего</p><label class="field">Ваше имя<input id="customer" type="text" autocomplete="name" placeholder="Как к вам обращаться"></label><label class="field">Номер телефона<input id="phone" type="tel" autocomplete="tel" placeholder="+7 999 123-45-67"></label><button class="action wide" onclick="sendDemo()">Отправить заявку</button><div class="panel accent"><strong>Демонстрационный режим</strong><p class="muted">Сайт пока не подключён к Telegram-серверу. Заявки не отправляются. Для реальной отправки подключим защищённый сервер бота.</p></div>`}h+='</div>'}document.getElementById('app').innerHTML=h;renderBottom();renderModal()}
function renderBottom(){let b=document.getElementById('bottom');if(screen==='welcome'||screen==='home'){b.innerHTML='';return}b.innerHTML=`<div class="bottom"><div><div class="meta">🛒 Ваша смета</div><div class="sum">${rub(total())}</div></div><button class="action" onclick="go('cart')">Открыть смету →</button></div>`}
function renderModal(){document.getElementById('modal').innerHTML=modal==='reset'?`<div class="modal-cover"><div class="modal"><h2>🔄 Начать заново?</h2><p>Все выбранные позиции и количество детей будут удалены. Это действие нельзя отменить.</p><button class="action danger wide" onclick="resetYes()">Да, начать заново</button><button class="action light wide" style="margin-top:10px" onclick="closeModal()">Нет, вернуться</button></div></div>`:''}
function sendDemo(){let n=document.getElementById('customer').value.trim(),p=document.getElementById('phone').value.trim();if(!n||p.replace(/\D/g,'').length<7)return alert('Укажите имя и корректный номер телефона');alert('Это демонстрация дизайна. Заявка не отправлена. Для реальной отправки подключим Telegram-бота к серверу.');}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="wrap"><h2>Ошибка загрузки</h2><pre>'+esc(e.message)+'</pre></div>';console.error(e)}
</script></body></html>
