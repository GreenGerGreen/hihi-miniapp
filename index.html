.home-content{padding:0 16px 18px;margin-top:-3px}
.home-kids{background:#f8faff;border-radius:22px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#102b78;font-size:15px;font-weight:900;box-shadow:0 6px 17px #122c8e23}
.home-kids .counter{gap:6px}.home-kids .counter button{width:40px;height:40px;min-width:40px;border-radius:12px;background:#94eaff;font-size:25px}.home-kids .counter b{font-size:22px;min-width:25px}
.home-categories{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0}
.home-category{border:2px solid #fff;border-radius:23px;min-height:132px;position:relative;overflow:hidden;padding:57px 12px 13px;text-align:left;color:white;box-shadow:0 8px 18px #102f8d27}
.home-category.pink{background:linear-gradient(140deg,#ff24ad,#e5008e)}.home-category.cyan{background:linear-gradient(145deg,#2cddf5,#0096dc)}.home-category.blue{background:linear-gradient(135deg,#128aff,#1744ca)}
.home-category strong{display:block;font-size:clamp(14px,3.7vw,20px);line-height:1.13;position:relative;z-index:2;text-shadow:0 2px 3px #132b5b44}
.home-category-icon{position:absolute;right:12px;top:8px;width:64px;height:58px;display:grid;place-items:center;font-size:42px;overflow:hidden}
.home-category-icon img{width:100%;height:100%;object-fit:contain}
.home-arrow{position:absolute;right:10px;bottom:10px;border-radius:50%;width:25px;height:25px;background:#fff;color:#0b62b9;display:grid;place-items:center;font-size:25px;font-weight:900}
.home-cart{background:#f8faff;border-radius:22px;display:flex;gap:8px;padding:10px;align-items:center;box-shadow:0 6px 16px #122c8e20}
.home-cart-main{border:0;background:transparent;color:#122b7c;display:flex;justify-content:space-between;align-items:center;gap:7px;flex:1;font-size:16px;font-weight:900;padding:10px 4px;min-width:0}
.home-cart-main strong{color:#e60095;font-size:20px;white-space:nowrap}
.home-cart-reset{border:1px solid #ffc4e7;background:#fff0f8;color:#e00088;width:42px;height:42px;flex:0 0 42px;border-radius:13px;font-size:27px;font-weight:800}
.home-checkout{width:100%;border:2px solid #fff;color:white;background:linear-gradient(120deg,#ff2bb0,#db008b);border-radius:28px;min-height:62px;margin-top:14px;font-size:21px;font-weight:900;box-shadow:0 8px 20px #d9008d40}
.home-checkout span{margin-left:10px}

function iconFor(emoji,name=''){
let n=String(name||'');let key=n;
if(!CATALOG_ICONS[key]){
const map={'🍕':'Пицца','🍗':'Наггетсы','🍟':'Картофель фри','🥔':'Картофель по-деревенски','🥫':'Соусы','🥪':'Канапе','🥩':'Мясная нарезка','🧀':'Сырная тарелка','🥒':'Свежие овощи','🍇':'Фруктовое ассорти','🥞':'Блинчики с топпингом','🍬':'Сладкий набор','🍨':'Мороженое','🍾':'Детское шампанское','🧃':'Сок','💧':'Вода','☕':'Капучино','🎭':'Анимационная программа','🗺️':'Квест / челлендж-пати','🎊':'Бумажное шоу','🫧':'Шоу мыльных пузырей','🪅':'Пиньята с конфетами','🎨':'Аквагрим','⭐':'Блеск-тату','🎈':'Шар с надписью','🧸':'Игровая комната','🃏':'Мафия','🎲':'Настольные игры','🪩':'Дискотека с мыльными пузырями','🎤':'Дискотека с караоке','🔢':'Шар «Цифра»','💖':'Шар «Звезда / сердце»','🎁':'Композиция «Цифра»','🕯️':'Свеча-фонтан','🎮':'Дискотека с мыльными пузырями'};
key=map[emoji]||'Анимационная программа';
}
return `<img class="item-icon" src="${CATALOG_ICONS[key]}" alt="" loading="lazy">`;
}
function choice(label,act,right='›'){return `<button class="choice" onclick="${act}"><span>${esc(label)}</span><span>${esc(right)}</span></button>`}
function foodCard(x,i,kind='food'){let id=(kind==='food'||kind==='drink'?table:kind)+'|'+x[0],q=qty(id);return `<article class="panel"><div class="product"><div class="product-art">${iconFor(x[3],x[0])}</div><div class="product-text"><h3>${esc(x[0])}</h3><div class="muted">${esc(x[2]||'')}</div><div class="price">${rub(x[1])}</div></div></div><div class="mini-counter"><span class="pill">${q} шт. в смете</span><div class="counter"><button aria-label="Убрать" onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button aria-label="Добавить" onclick="put(${attr(id)},${attr(x[0])},${x[1]},1,${attr(kind==='food'||kind==='drink'?table:kind)},{linked:false,unit:'шт.'})">+</button></div></div></article>`}
function tiles(){return `<div class="tiles"><button class="tile" onclick="table='child';go('table')"><span class="emoji">${iconFor('🍕')}</span><strong>Детский<br>стол</strong></button><button class="tile" onclick="table='adult';go('table')"><span class="emoji">${iconFor('☕')}</span><strong>Стол<br>родителей</strong></button><button class="tile" onclick="go('fun')"><span class="emoji">${iconFor('🎮')}</span><strong>Развлечения<br>и программы</strong></button><button class="tile" onclick="go('decor')"><span class="emoji">${iconFor('🎈')}</span><strong>Оформление<br>и декор</strong></button></div>`}
function countCard(id,name,price,kind,unit='шт.',desc=''){let q=qty(id);return `<div class="panel"><div class="row"><div><h3>${esc(name)}</h3><div class="muted">${esc(desc)}</div></div><span class="price">${rub(price)}</span></div><div class="mini-counter"><span class="pill">В смете: ${q} ${unit}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button onclick="put(${attr(id)},${attr(name)},${price},1,${attr(kind)},{unit:${attr(unit)}})">+</button></div></div></div>`}
function switchTable(next){if(table===next)return;table=next;flow={};screen='table';render();window.scrollTo(0,0)}
function tableTabs(){return `<div class="table-tabs" role="tablist" aria-label="Выбор стола"><button role="tab" aria-selected="${table==='child'}" class="${table==='child'?'active':''}" onclick="switchTable('child')">🍟 Детский стол</button><button role="tab" aria-selected="${table==='adult'}" class="${table==='adult'?'active':''}" onclick="switchTable('adult')">☕ Стол родителей</button></div>`}
function tableRoot(){return navigation('home')+`${tableTabs()}<p class="subtitle">Выберите угощения для праздника</p><div class="tiles table-menu-tiles" style="margin-top:16px"><button class="tile" onclick="go('pizzaSize')"><span class="emoji">${iconFor('🍕')}</span><strong>Пицца</strong></button><button class="tile" onclick="go('nuggetQty')"><span class="emoji">${iconFor('🍗')}</span><strong>Наггетсы</strong></button><button class="tile" onclick="go('drinks')"><span class="emoji">${iconFor('🧃')}</span><strong>Напитки</strong></button><button class="tile" onclick="go('sauceFlavor')"><span class="emoji">${iconFor('🥫')}</span><strong>Соусы</strong></button></div><div class="section-title"><h2>Еда и угощения</h2></div>${FOODS.map((x,i)=>foodCard(x,i)).join('')}`}
function chooseQuantity(title,after){flow.after=after;if(table==='adult'&&after!=='play')return `<span class="step">Количество</span><h2 class="screen-title">${esc(title)}</h2><p class="subtitle">Укажите количество порций для стола родителей</p>${choice('✏️ Указать количество',"go('manualQty')",'›')}`;return `<span class="step">Количество</span><h2 class="screen-title">${esc(title)}</h2><p class="subtitle">Сколько порций вам нужно?</p>${choice('👧 По количеству детей — '+state.kids+' порций','quantityDone('+state.kids+',true)','+')}${choice('✏️ Указать своё количество',"go('manualQty')",'›')}`}
function quantityDone(n,linked){if(table==='adult'&&flow.after!=='play')linked=false;flow.count=n;flow.linked=linked;if(flow.after==='nugget')go('nuggetSize');else if(flow.after==='sauce'){let name='Соус '+flow.flavor+', 25 г';put(table+'|'+name,name,60,n,table,{linked,unit:'шт.'});go('sauceFlavor')}else if(flow.after==='food'){let x=FOODS[flow.food];put(table+'|'+x[0],x[0],x[1],n,table,{linked,unit:'порц.'});go('table')}else if(flow.after==='juice'||flow.after==='water')go('drinkFlavor');else if(flow.after==='play'){let id='fun|Игровая комната';state.cart[id]={id,name:'Игровая комната',price:150,qty:n,kind:'fun',unit:'чел.',linked,blocks:1,durationStep:30};save();go('fun')}}
function pickQty(i){let x=FOODS[i];put(table+'|'+x[0],x[0],x[1],1,table,{linked:false,unit:'порц.'})}
function pizzaAdd(i){let name='Пицца «'+PIZZA[i]+'», '+flow.size+' см';put(table+'|'+name,name,flow.price,1,table)}
function drinkPick(i){let name=flow.drink==='juice'?'Сок '+JUICE[i].toLowerCase()+', '+flow.volume:'Вода '+['газированная','негазированная'][i]+', '+flow.volume;let id=table+'|'+name;let n=qty(id)?1:(flow.count||1);put(id,name,flow.price,n,table,{linked:!qty(id)&&!!flow.linked});flow.count=1;flow.linked=false}
function drinkVolume(i){let juice=flow.drink==='juice';flow.volume=juice?(i===0?'0,2 л':'1 л'):(i===0?'0,5 л':'1,5 л');flow.price=juice?(i===0?60:250):(i===0?60:120);flow.count=1;flow.linked=false;if(i===0&&table!=='adult'){flow.after=flow.drink;go('drinkQty')}else go('drinkFlavor')}
function paperShowAdd(i){
const variant=['серебряная','неоновая'][i];
const name='Бумажное шоу · '+variant+' бумага';
for(const id of Object.keys(state.cart))if(id.startsWith('fun|Бумажное шоу'))delete state.cart[id];
put('fun|'+name,name,5500,1,'fun',{unit:'шоу',durationStep:30});
go('fun');
}
function serviceAdd(i){let x=SERVICES[i];if(x[4]==='paper'){go('paperShow');return}if(x[4]==='theme'){go('ages');return}if(x[4]==='play'){flow={after:'play'};go('playQty');return}let id='fun|'+x[0];if(x[4]==='hours'&&qty(id)){changeBlocks(id,1);return}put(id,x[0],x[1],1,'fun',x[4]==='hours'?{unit:'ч.',blocks:1,durationStep:60}:{unit:'шт.'})}
function themeAdd(i){let name='Анимационная программа — '+THEMES[flow.age][i],id='fun|'+name;if(qty(id)){changeBlocks(id,1);return}put(id,name,4500,1,'fun',{unit:'ч.',blocks:1,durationStep:60});go('fun')}

      <button class="home-category blue" onclick="go('decor')"><span class="home-category-icon">🎈</span><strong>Оформление<br>и декор</strong><span class="home-arrow">›</span></button>
    </div>

    <button class="home-checkout" onclick="go('request')">⚑ &nbsp; Оформить заявку <span>›</span></button>
  </div></div>`}else{h='<div class="wrap">';if(screen==='table')h+=tableRoot();else if(screen==='pizzaSize')h+=navigation('table')+`<h2 class="screen-title">🍕 Размер пиццы</h2>${choice('25 см','flow={size:25,price:700};go(\'pizzaFlavor\')','700 ₽')}${choice('30 см','flow={size:30,price:850};go(\'pizzaFlavor\')','850 ₽')}`;else if(screen==='pizzaFlavor'){h+=navigation('pizzaSize')+`<h2 class="screen-title">🍕 Пицца — ${flow.size} см</h2><p class="subtitle">${rub(flow.price)} за штуку</p>`;PIZZA.forEach((name,i)=>{let id=table+'|Пицца «'+name+'», '+flow.size+' см';h+=`<div class="panel"><div class="row"><strong>${esc(name)}</strong><span class="pill">${qty(id)} шт.</span></div><div class="mini-counter"><span class="muted">${rub(flow.price)}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${qty(id)?'':'disabled'}>−</button><b>${qty(id)}</b><button onclick="pizzaAdd(${i})">+</button></div></div></div>`});}else if(screen==='nuggetQty')h+=navigation('table')+chooseQuantity('🍗 Наггетсы','nugget');else if(screen==='nuggetSize'){h+=navigation('nuggetQty')+`<h2 class="screen-title">🍗 Наггетсы в порции</h2><p class="subtitle">Выбрано порций: ${flow.count}</p>`;[2,4,6].forEach((n,i)=>h+=choice(n+' шт. в порции',`let name='Наггетсы ${n} шт. в порции';put(table+'|'+name,name,${[80,120,150][i]},flow.count,table,{unit:'порц.',linked:flow.linked});go('table')`,rub([80,120,150][i])))}else if(screen==='foodQty'){let x=FOODS[flow.food];h+=navigation('table')+chooseQuantity('🍽️ '+x[0],'food')}else if(screen==='pancakeFlavor'){h+=navigation('foodQty')+`<h2 class="screen-title">🥞 Топпинг для блинчиков</h2>`;['Шоколад','Клубника','Карамель','Сгущёнка'].forEach(x=>h+=choice(x,`let name='Блинчики с топпингом — '+${'${attr(x)}'};put(table+'|'+name,name,150,flow.count,table,{linked:flow.linked,unit:'порц.'});go('table')`))}else if(screen==='sauceFlavor'){h+=navigation('table')+`<h2 class="screen-title">🥫 Соус</h2><p class="subtitle">25 г · 60 ₽</p>`;['Сырный','Кетчуп','Кисло-сладкий'].forEach(x=>h+=choice(x,`flow={flavor:${attr(x.toLowerCase())},after:'sauce'};go('sauceQty')`))}else if(screen==='sauceQty')h+=navigation('sauceFlavor')+chooseQuantity('🥫 Соус '+flow.flavor,'sauce');else if(screen==='drinks'){h+=navigation('table')+`<h2 class="screen-title">🥤 Напитки</h2>`+choice('🧃 Сок',"flow={drink:'juice'};go('drinkVolume')")+choice('💧 Вода',"flow={drink:'water'};go('drinkVolume')");h+=foodCard(['Чай в чашке',80,'180 мл','🍵',false],0,'drink');if(table==='adult'){h+=foodCard(['Чай в чайничке',300,'900 мл','🫖',false],0,'drink');h+=choice('☕ Кофе — выбрать вид',"go('coffee')")}}else if(screen==='coffee'){h+=navigation('drinks')+`<h2 class="screen-title">☕ Кофе</h2>`;COFFEE.forEach(x=>h+=countCard('adult|'+x[0],x[0],x[1],'adult','шт.',x[2]))}else if(screen==='drinkVolume'){h+=navigation('drinks')+`<h2 class="screen-title">${flow.drink==='juice'?'🧃 Объём сока':'💧 Объём воды'}</h2>`;(flow.drink==='juice'?[['0,2 л',60],['1 л',250]]:[['0,5 л',60],['1,5 л',120]]).forEach((x,i)=>h+=choice(x[0],`drinkVolume(${i})`,rub(x[1])))}else if(screen==='drinkQty'){h+=navigation('drinkVolume')+chooseQuantity('Количество · '+flow.volume,flow.drink)}else if(screen==='drinkFlavor'){h+=navigation('drinkVolume')+`<h2 class="screen-title">${flow.drink==='juice'?'🧃 Сок':'💧 Вода'} — ${flow.volume}</h2><p class="subtitle">${rub(flow.price)} за упаковку</p>`;(flow.drink==='juice'?JUICE:['Газированная','Негазированная']).forEach((f,i)=>{let name=flow.drink==='juice'?'Сок '+f.toLowerCase()+', '+flow.volume:'Вода '+f.toLowerCase()+', '+flow.volume,id=table+'|'+name;h+=`<div class="panel"><div class="row"><strong>${esc(f)}</strong><span class="pill">${qty(id)} шт.</span></div><div class="mini-counter"><span class="muted">${rub(flow.price)}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${qty(id)?'':'disabled'}>−</button><b>${qty(id)}</b><button onclick="drinkPick(${i})">+</button></div></div></div>`});}else if(screen==='manualQty'){h+=navigation(flow.after==='nugget'?'nuggetQty':flow.after==='food'?'foodQty':flow.after==='sauce'?'sauceQty':flow.after==='play'?'playQty':'drinkQty')+`<h2 class="screen-title">Укажите количество</h2><label class="field">От 1 до 50<input id="manual" class="field-input" type="number" min="1" max="50" inputmode="numeric" placeholder="Введите число" style="width:100%;padding:15px;border-radius:15px;border:2px solid #dce8ff;margin-top:8px;font-size:18px"></label><button class="action wide" onclick="let n=Number(document.getElementById('manual').value);if(Number.isInteger(n)&&n>=1&&n<=50)quantityDone(n,false);else alert('Введите число от 1 до 50')">Продолжить</button>`}else if(screen==='fun'||screen==='decor'){let fun=screen==='fun',arr=fun?SERVICES:DECOR;h+=navigation('home')+`<h2 class="screen-title">${fun?'🎭 Развлечения':'🎈 Оформление'}</h2><p class="subtitle">Выберите то, что сделает праздник особенным</p>`;arr.forEach((x,i)=>{let id=(fun?'fun':'decor')+'|'+x[0],q=qty(id);h+=`<div class="panel"><div class="product"><div class="product-art">${fun&&x[4]==='paper'?`<img class="item-icon" src="${CATALOG_ICONS['Бумажное шоу']}" alt="">`:iconFor(x[3],x[0])}</div><div class="product-text"><h3>${esc(x[0])}</h3><div class="muted">${esc(x[2])}</div><div class="price">${rub(x[1])}</div></div></div><div class="mini-counter"><span class="pill">${q?`В смете: ${q}`:'Не выбрано'}</span><div class="counter">${x[4]==='theme'||x[4]==='play'||x[4]==='paper'?`<button class="action soft" style="font-size:12px;width:auto;padding:8px" onclick="serviceAdd(${i})">Выбрать</button>`:`<><button onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button onclick="${fun?`serviceAdd(${i})`:`put(${attr(id)},${attr(x[0])},${x[1]},1,'decor')`}">+</button></>`}</div></div></div>`}) }else if(screen==='paperShow'){

['Серебряная бумага','Неоновая бумага'].forEach((label,i)=>h+=`<button class="paper-option" onclick="paperShowAdd(${i})"><img src="${CATALOG_ICONS[label]}" alt=""><span><strong>${label}</strong><small>30 минут · 5 500 ₽</small></span><b>＋</b></button>`);
h+='</div>';
}else if(screen==='ages'){h+=navigation('fun')+`<h2 class="screen-title">🎭 Возрастная группа</h2>`;Object.keys(THEMES).forEach(a=>h+=choice(a,`flow.age=${attr(a)};go('themes')`))}else if(screen==='themes'){h+=navigation('ages')+`<h2 class="screen-title">🎭 Тема анимации</h2><p class="subtitle">${esc(flow.age)}</p>`;THEMES[flow.age].forEach((a,i)=>h+=choice(a,`themeAdd(${i})`))}else if(screen==='playQty'){h+=navigation('fun')+chooseQuantity('🧸 Игровая комната','play')}else if(screen==='cart')h+=cartScreen();else if(screen==='editList'){h+=navigation('cart')+`<h2 class="screen-title">✏️ Изменить смету</h2><p class="subtitle">Выберите позицию для редактирования</p>`;items().forEach(x=>h+=choice(x.name,`editId=${attr(x.id)};go('edit')`,x.qty+' '+(x.unit||'шт.')));if(!items().length)h+='<div class="empty">Смета пуста</div>'}else if(screen==='edit'){let x=state.cart[editId];if(!x){go('editList');return}h+=navigation('editList')+`<h2 class="screen-title">${esc(x.name)}</h2><div class="panel"><div class="row"><span class="muted">${rub(x.price)} за единицу</span><span class="price">${rub(x.qty*x.price*(x.blocks||1))}</span></div><div class="mini-counter"><span>Количество</span><div class="counter"><button onclick="change(${attr(editId)},-1)">−</button><b>${x.qty}</b><button onclick="change(${attr(editId)},1)" ${editId===OWN_FOOD_ID?'disabled':''}>+</button></div></div>${x.blocks?`<div class="divider"></div><div class="mini-counter"><span>⏱ Время: ${x.blocks*(x.durationStep||30)} мин</span><div class="counter"><button onclick="changeBlocks(${attr(editId)},-1)">−</button><b>${x.blocks}</b><button onclick="changeBlocks(${attr(editId)},1)">+</button></div></div>`:''}</div><button class="action danger wide" onclick="delete state.cart[editId];save();go('editList')">Удалить позицию</button>`}else if(screen==='kidsEdit'){h+=navigation('cart')+`<h2 class="screen-title">👧 Изменить количество детей</h2><label class="field">От 1 до 30<input id="newKids" type="number" min="1" max="30" inputmode="numeric" value="${state.kids}"></label><button class="action wide" onclick="setKids(Number(document.getElementById('newKids').value))">Сохранить и вернуться в смету</button><p class="smallnote">Позиции, выбранные по количеству детей, пересчитаются. Ручные количества сохранятся.</p>`}else if(screen==='request'){h+=navigation('cart')+`<h2 class="screen-title">📨 Оформить заявку</h2><p class="subtitle">Только имя и телефон — ничего лишнего</p><label class="field">Ваше имя<input id="customer" type="text" autocomplete="name" placeholder="Как к вам обращаться"></label><label class="field">Номер телефона<input id="phone" type="tel" autocomplete="tel" placeholder="+7 999 123-45-67"></label><button class="action wide" onclick="sendDemo()">Отправить заявку</button><div class="panel accent"><strong>Демонстрационный режим</strong><p class="muted">Сайт пока не подключён к Telegram-серверу. Заявки не отправляются. Для реальной отправки подключим защищённый сервер бота.</p></div>`}h+='</div>'}document.getElementById('app').innerHTML=h;renderBottom();renderModal()}
function renderBottom(){

const isFood=foodScreens.includes(screen);
const isDetail=isFood||['ages','themes','playQty','paperShow'].includes(screen);
const catalog=isFood?'table':'fun';
b.innerHTML=`<div class="bottom bottom-v7">
${screen!=='home'?`<button class="action light footer-back" onclick="goBack()">← Назад</button>`:''}
${isDetail?`<button class="action blue footer-continue" onclick="go('${catalog}')">Продолжить выбор ↗</button>`:''}
${screen!=='home'&&screen!=='cart'?`<button class="action footer-cart" onclick="go('cart')"><span>🛒 Открыть смету</span><strong>${rub(total())}</strong></button>`:''}

${screen==='cart'&&items().length?`<button class="action danger footer-reset" onclick="resetAsk()">↻ Составить смету заново</button>`:''}
</div>`;
}
