function iconFor(emoji,name=''){
let n=String(name||'');let key=n;
if(!CATALOG_ICONS[key]){
const map={'🍕':'Пицца','🍗':'Наггетсы','🍟':'Картофель фри','🥔':'Картофель по-деревенски','🥫':'Соусы','🥪':'Канапе','🥩':'Мясная нарезка','🧀':'Сырная тарелка','🥒':'Свежие овощи','🍇':'Фруктовое ассорти','🥞':'Блинчики с топпингом','🍬':'Сладкий набор','🍨':'Мороженое','🍾':'Детское шампанское','🧃':'Сок','💧':'Вода','☕':'Капучино','🎭':'Анимационная программа','🗺️':'Квест / челлендж-пати','🎊':'Бумажное шоу','🫧':'Шоу мыльных пузырей','🪅':'Пиньята с конфетами','🎨':'Аквагрим','⭐':'Блеск-тату','🎈':'Шар с надписью','🧸':'Игровая комната','🃏':'Мафия','🎲':'Настольные игры','🪩':'Дискотека с мыльными пузырями','🎤':'Дискотека с караоке','🔢':'Шар «Цифра»','💖':'Шар «Звезда / сердце»','🎁':'Композиция «Цифра»','🕯️':'Свеча-фонтан','🎮':'Дискотека с мыльными пузырями'};
key=map[emoji]||'Пицца';
}
return `<img class="item-icon" src="${CATALOG_ICONS[key]}" alt="" loading="lazy">`;
}
function choice(label,act,right='›'){return `<button class="choice" onclick="${act}"><span>${esc(label)}</span><span>${esc(right)}</span></button>`}
function foodCard(x,i,kind='food'){let id=(kind==='food'||kind==='drink'?table:kind)+'|'+x[0],q=qty(id);return `<article class="panel"><div class="product"><div class="product-art">${iconFor(x[3],x[0])}</div><div class="product-text"><h3>${esc(x[0])}</h3><div class="muted">${esc(x[2]||'')}</div><div class="price">${rub(x[1])}</div></div></div><div class="mini-counter"><span class="pill">${q} шт. в смете</span><div class="counter"><button aria-label="Убрать" onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button aria-label="Добавить" onclick="put(${attr(id)},${attr(x[0])},${x[1]},1,${attr(kind==='food'||kind==='drink'?table:kind)},{linked:false,unit:'шт.'})">+</button></div></div></article>`}
function tiles(){return `<div class="tiles"><button class="tile" onclick="table='child';go('table')"><span class="emoji">${iconFor('🍕')}</span><strong>Детский<br>стол</strong></button><button class="tile" onclick="table='adult';go('table')"><span class="emoji">${iconFor('☕')}</span><strong>Стол<br>родителей</strong></button><button class="tile" onclick="go('fun')"><span class="emoji">${iconFor('🎮')}</span><strong>Развлечения<br>и программы</strong></button><button class="tile" onclick="go('decor')"><span class="emoji">${iconFor('🎈')}</span><strong>Оформление<br>и декор</strong></button></div>`}
function countCard(id,name,price,kind,unit='шт.',desc=''){let q=qty(id);return `<div class="panel"><div class="row"><div><h3>${esc(name)}</h3><div class="muted">${esc(desc)}</div></div><span class="price">${rub(price)}</span></div><div class="mini-counter"><span class="pill">В смете: ${q} ${unit}</span><div class="counter"><button onclick="change(${attr(id)},-1)" ${q?'':'disabled'}>−</button><b>${q}</b><button onclick="put(${attr(id)},${attr(name)},${price},1,${attr(kind)},{unit:${attr(unit)}})">+</button></div></div></div>`}
function switchTable(next){if(table===next)return;table=next;flow={};screen='table';render();window.scrollTo(0,0)}
function tableTabs(){return `<div class="table-tabs" role="tablist" aria-label="Выбор стола"><button role="tab" aria-selected="${table==='child'}" class="${table==='child'?'active':''}" onclick="switchTable('child')">🍟 Детский стол</button><button role="tab" aria-selected="${table==='adult'}" class="${table==='adult'?'active':''}" onclick="switchTable('adult')">☕ Стол родителей</button></div>`}
function tableRoot(){return navigation('home')+`${tableTabs()}<p class="subtitle">Выберите угощения для праздника</p><div class="tiles" style="margin-top:16px"><button class="tile" onclick="go('pizzaSize')"><span class="emoji">${iconFor('🍕')}</span><strong>Пицца</strong></button><button class="tile" onclick="go('nuggetQty')"><span class="emoji">${iconFor('🍗')}</span><strong>Наггетсы</strong></button><button class="tile" onclick="go('drinks')"><span class="emoji">${iconFor('🧃')}</span><strong>Напитки</strong></button><button class="tile" onclick="go('sauceFlavor')"><span class="emoji">${iconFor('🥫')}</span><strong>Соусы</strong></button></div><div class="section-title"><h2>Еда и угощения</h2></div>${FOODS.map((x,i)=>foodCard(x,i)).join('')}`}
function chooseQuantity(title,after){flow.after=after;if(table==='adult'&&after!=='play')return `<span class="step">Количество</span><h2 class="screen-title">${esc(title)}</h2><p class="subtitle">Укажите количество порций для стола родителей</p>${choice('✏️ Указать количество',"go('manualQty')",'›')}`;return `<span class="step">Количество</span><h2 class="screen-title">${esc(title)}</h2><p class="subtitle">Сколько порций вам нужно?</p>${choice('👧 По количеству детей — '+state.kids+' порций','quantityDone('+state.kids+',true)','+')}${choice('✏️ Указать своё количество',"go('manualQty')",'›')}`}
function quantityDone(n,linked){if(table==='adult'&&flow.after!=='play')linked=false;flow.count=n;flow.linked=linked;if(flow.after==='nugget')go('nuggetSize');else if(flow.after==='sauce'){let name='Соус '+flow.flavor+', 25 г';put(table+'|'+name,name,60,n,table,{linked,unit:'шт.'});go('sauceFlavor')}else if(flow.after==='food'){let x=FOODS[flow.food];put(table+'|'+x[0],x[0],x[1],n,table,{linked,unit:'порц.'});go('table')}else if(flow.after==='juice'||flow.after==='water')go('drinkFlavor');else if(flow.after==='play'){let id='fun|Игровая комната';state.cart[id]={id,name:'Игровая комната',price:150,qty:n,kind:'fun',unit:'чел.',linked,blocks:1,durationStep:30};save();go('fun')}}
function pickQty(i){flow={food:i,after:'food'};go('foodQty')}
function pizzaAdd(i){let name='Пицца «'+PIZZA[i]+'», '+flow.size+' см';put(table+'|'+name,name,flow.price,1,table)}
function drinkPick(i){let name=flow.drink==='juice'?'Сок '+JUICE[i].toLowerCase()+', '+flow.volume:'Вода '+['газированная','негазированная'][i]+', '+flow.volume;let id=table+'|'+name;let n=qty(id)?1:(flow.count||1);put(id,name,flow.price,n,table,{linked:!qty(id)&&!!flow.linked});flow.count=1;flow.linked=false}
function drinkVolume(i){let juice=flow.drink==='juice';flow.volume=juice?(i===0?'0,2 л':'1 л'):(i===0?'0,5 л':'1,5 л');flow.price=juice?(i===0?60:250):(i===0?60:120);flow.count=1;flow.linked=false;if(i===0&&table!=='adult'){flow.after=flow.drink;go('drinkQty')}else go('drinkFlavor')}
function paperShowAdd(i){
const variant=['серебряная','неоновая'][i];
const name='Бумажное шоу · '+variant+' бумага';
for(const id of Object.keys(state.cart))if(id.startsWith('fun|Бумажное шоу'))delete state.cart[id];
put('fun|'+name,name,5500,1,'fun',{unit:'шоу',durationStep:30});
go('fun');
}
function serviceAdd(i){let x=SERVICES[i];if(x[4]==='paper'){go('paperShow');return}if(x[4]==='theme'){go('ages');return}if(x[4]==='play'){flow={after:'play'};go('playQty');return}let id='fun|'+x[0];if(x[4]==='hours'&&qty(id)){changeBlocks(id,1);return}put(id,x[0],x[1],1,'fun',x[4]==='hours'?{unit:'ч.',blocks:1,durationStep:60}:{unit:'шт.'})}
function themeAdd(i){let name='Анимационная программа — '+THEMES[flow.age][i],id='fun|'+name;if(qty(id)){changeBlocks(id,1);return}put(id,name,4500,1,'fun',{unit:'ч.',blocks:1,durationStep:60});go('fun')}
function cartScreen(){let h=navigation('home')+`<h2 class="screen-title">🧾 Моя смета</h2><p class="subtitle">Все выбранные позиции в одном месте</p>`;if(!items().length)h+=`<div class="panel empty"><div class="big">🛒</div><h3>Пока ничего нет</h3><p>Добавьте угощения или развлечения</p><button class="action" onclick="go('home')">Выбрать товары</button></div>`;for(const kind of ['child','adult','fun','decor']){let list=items().filter(x=>x.kind===kind);if(!list.length)continue;h+=`<div class="section-title"><h2>${catLabel(kind)}</h2></div><div class="panel">`;for(const x of list)h+=`<div class="cart-line"><div class="row"><div><strong>${esc(x.name)}</strong><div class="detail">${x.qty} ${esc(x.unit||'шт.')} × ${rub(x.price)}${x.blocks>1?' × '+x.blocks+' периодов':''}</div></div><span class="sum">${rub(x.qty*x.price*(x.blocks||1))}</span></div></div>`;h+='</div>'}h+=`<div class="total-card"><div class="row"><span>Итого за праздник</span><strong>${rub(total())}</strong></div><small>Предварительный расчёт · не является бронированием</small></div><div class="actions"><button class="action soft" onclick="go('editList')">✏️ Изменить</button><button class="action blue" onclick="go('home')">＋ Добавить</button></div><div class="actions"><button class="action light" onclick="go('kidsEdit')">👧 Число детей</button></div><button class="action wide" style="margin-top:13px" onclick="go('request')">📨 Отправить заявку</button>`;return h}
