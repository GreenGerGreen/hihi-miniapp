<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Хи-Хи — конструктор праздника</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#352c37;background:#fff8f4}*{box-sizing:border-box}body{margin:0}.shell{max-width:650px;margin:auto;min-height:100vh;padding:20px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:26px;font-weight:900;letter-spacing:-1px}.muted{color:#8c7e89;font-size:13px}.pill{border-radius:100px;padding:8px 12px;background:#ffe3eb;font-weight:700;color:#a63b62;font-size:12px}.hero{background:linear-gradient(125deg,#ff7da8,#f8aa5e);color:white;padding:22px;border-radius:24px;margin:20px 0;box-shadow:0 10px 28px #ff8ca442}.hero h1{font-size:27px;line-height:1.12;margin:0 0 10px}.hero p{margin:0;opacity:.95}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}.tab{background:white;border:1px solid #f0e6e9;border-radius:16px;padding:12px 4px;text-align:center;font-size:11px;font-weight:700;color:#6c5968;cursor:pointer}.tab span{display:block;font-size:24px;margin-bottom:4px}.tab.active{background:#fff0f4;border:2px solid #f76f9a;color:#a53b63}.card{background:white;border:1px solid #f1e9e9;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #3b203908}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:750}.price{font-weight:850;white-space:nowrap}.sub{font-size:12px;color:#8d8189;margin-top:4px}.btn{border:0;border-radius:13px;background:#f86c9c;color:white;font-weight:800;padding:12px 15px;font-size:14px;cursor:pointer}.btn.light{background:#fff0f4;color:#ae3d65}.btn.ghost{background:#f6f1f3;color:#6b5665}.btn.danger{background:#ffe7e9;color:#bf4756}.btn:active{transform:scale(.98)}.wide{width:100%}.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}.actions>*{flex:1}.counter{display:flex;align-items:center;gap:12px}.counter button{border:0;background:#fff0f4;color:#b73e68;border-radius:11px;width:38px;height:38px;font-size:22px;font-weight:700}.counter strong{min-width:25px;text-align:center}.section{font-size:19px;font-weight:850;margin:24px 0 10px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffdfa;border-top:1px solid #f0e6e8;padding:10px max(16px,calc((100vw - 620px)/2));display:flex;align-items:center;gap:10px;box-shadow:0 -6px 20px #2414230b}.footer .btn{flex:1}.total{font-size:20px;font-weight:900}.back{border:0;background:none;color:#ac4168;font-weight:800;padding:10px 0;cursor:pointer}.choice{display:block;width:100%;border:1px solid #f1e4e9;background:white;border-radius:14px;text-align:left;padding:14px;margin:8px 0;font-size:15px;font-weight:700;color:#443844;cursor:pointer}.choice small{float:right;color:#9e6880}.choice:active{background:#fff0f4}.qtyline{display:flex;justify-content:space-between;align-items:center;gap:12px}.input{width:100%;border:1px solid #e5d5dc;border-radius:13px;padding:14px;font-size:17px;margin:8px 0;background:white}.empty{text-align:center;padding:35px 12px;color:#857783}.tag{display:inline-block;background:#fff0f4;color:#a9426b;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}.group{padding-top:8px}.notice{background:#fff0df;padding:12px;border-radius:13px;font-size:12px;color:#806446;margin:14px 0}h2{font-size:21px} .sticky-mini{background:#fff0f4;padding:12px;border-radius:14px;margin:12px 0}.hidden{display:none}@media(max-width:370px){.tab{font-size:10px}.shell{padding-left:10px;padding-right:10px}}
</style></head><body><main class="shell" id="app"></main><footer class="footer" id="footer"></footer><script>
const flavors=['Маргарита','С ветчиной','Пепперони','С курицей','Сырная','С грибами'];const juices=['Яблочный','Клубничный','Мультифрукт','Вишнёвый','Персиковый','Апельсиновый'];const programs={'До 5 лет':['Зайчик и лисичка','Лунтик и Мила','Приключения Буратино','Свинка Пеппа','Три кота','Фиксики','Вспыш','Барбоскины','Мимимишки','Маша и медведь'],'5–7 лет':['Алиса в стране чудес','Винкс','Вокруг света','Тролли','Холодное сердце','Щенячий патруль','Корпорация монстров','Миньоны','Микки и Минни Маус','Индейцы','Куклы LOL','Новогодняя сказка','Энгри Бёрдс','Дино-пати','Литтл пони','Как приручить дракона','Барби'],'7–9 лет':['Космические приключения','Пираты','Майнкрафт','Пикачу','Супер-кот и Леди Баг','Черепашка ниндзя','Бэтмен','Человек-паук','Флэш'],'От 9 лет':['Гарри Поттер','Тик-ток','Венсдей и Энид','Хагги Ваги','Вампир и ведьма','Джокер и Харли Квин','Рок вечеринка','Форт Боярд','Челлендж пати','Сказка-квест','Музыкальное лото','Квиз-тайм']};
const snacks=[['Картофель фри',150,'100 г','linked'],['Картофель по-деревенски',150,'100 г','linked'],['Канапе',120,'2 шт.; ветчина, сыр, виноград, хлеб','linked'],['Мясная нарезка',800,'300 г'],['Сырная тарелка',750,'300 г'],['Свежие овощи',550,'400 г'],['Фруктовое ассорти',700,'Фрукты в ассортименте'],['Блинчики с топпингом',150,'2 шт.; топпинг на выбор'],['Сладкий набор',700,'500 г'],['Мороженое',100,'1 шарик']];const services=[['Анимационная программа',4500,'1 час','hours'],['Квест / челлендж-пати',5500,'1 час','hours'],['Бумажное шоу',4500,'30 мин'],['Серебряное / цветное шоу',5500,'30 мин'],['Поролоновое шоу',4000,'30 мин'],['Шоу мыльных пузырей',4500,'30 мин'],['Пиньята с конфетами',3000,''],['Аквагрим',300,'1 человек'],['Блеск-тату',300,'1 человек'],['Шар для моделирования',50,'1 шт.'],['Игровая комната',150,'1 ребёнок / 30 мин','play'],['Мафия',3500,'1 час'],['Настольные игры',3000,'1 час'],['Дискотека с мыльными пузырями',2500,'30 мин'],['Дискотека с караоке',2500,'30 мин']];const decor=[['Шар с надписью',150,'С гелием'],['Шар «Цифра»',750,'С гелием'],['Шар «Звезда / сердце»',350,'С гелием'],['Шар «Фигура»',650,'С гелием'],['Композиция «Цифра»',2000,'Шары с цифрой'],['Свеча-фонтан',120,'1 шт.']];
let saved;try{saved=JSON.parse(localStorage.getItem('hihi-demo'))}catch(e){saved=null}let state=saved&&typeof saved==='object'?saved:{kids:0,cart:{}};if(!state.cart)state.cart={};let page=state.kids?'home':'welcome',table='child',flow={},editing=null,tab='child';const money=n=>n.toLocaleString('ru-RU')+' ₽';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem('hihi-demo',JSON.stringify(state))}catch(e){}};const total=()=>Object.values(state.cart).reduce((s,x)=>s+x.qty*x.price*(x.blocks||1),0);const count=()=>Object.values(state.cart).reduce((s,x)=>s+x.qty,0);const keys=()=>Object.keys(state.cart);const root=()=>{page='home';render()};const go=(p)=>{page=p;render()};const put=(id,name,price,qty=1,kind='child',linked=false,extra={})=>{let x=state.cart[id];if(x){x.qty+=qty;if(linked)x.linked=true}else state.cart[id]={id,name,price,qty,kind,linked,...extra};if(state.cart[id].qty<=0)delete state.cart[id];persist();render()};const change=(id,d)=>{let x=state.cart[id];if(!x)return;x.qty=Math.max(0,Math.min(50,x.qty+d));if(!x.qty)delete state.cart[id];persist();render()};const reset=()=>go('confirmreset');const adjustKids=(n)=>{let old=state.kids;state.kids=n;for(const x of Object.values(state.cart)){if(x.linked)x.qty=n}persist();go(old?'cart':'home')};
function header(){return `<div class="top"><div><div class="logo">🎉 Хи-Хи</div><div class="muted">Конструктор праздника</div></div><span class="pill">${state.kids?state.kids+' детей':'Демо'}</span></div>`}function foot(){document.getElementById('footer').innerHTML=page==='welcome'||page==='kids'||page==='confirmreset'?`<button class="btn ghost wide" onclick="${page==='confirmreset'?'go(\'home\')':'go(\'welcome\')'}">← Назад</button>`:`<div><div class="muted">Ваша смета</div><div class="total">${money(total())}</div></div><button class="btn" onclick="go('cart')">🧾 Смета · ${count()}</button>`}function card(name,price,desc,action,qty=0){return `<div class="card"><div class="line"><div><div class="name">${safe(name)}</div>${desc?`<div class="sub">${safe(desc)}</div>`:''}</div><div class="price">${money(price)}</div></div><div class="actions"><button class="btn ${qty?'light':''}" onclick="${action}">${qty?'В смете: '+qty+' · Изменить':'Выбрать +'}</button></div></div>`}function options(title,arr,cb){return `<h2>${safe(title)}</h2>`+arr.map((x,i)=>`<button class="choice" onclick="${cb}(${i})">${safe(x[0])}<small>${x[1]?money(x[1]):''}</small></button>`).join('')}
function render(){let h=header();if(page==='welcome'){h+=`<div class="hero"><h1>Соберём праздник мечты!</h1><p>Еда, развлечения и оформление — всё в одной смете.</p></div><button class="btn wide" onclick="go('kids')">🎉 Собрать праздник</button><div class="notice">Это интерактивный прототип. Заявки не отправляются в кафе.</div>`}else if(page==='kids'){h+=`<h2>Сколько детей будет на празднике?</h2><div class="muted">От 1 до 30</div><input id="kids" class="input" type="number" min="1" max="30" inputmode="numeric" placeholder="Например, 8"><button class="btn wide" onclick="let n=Number(document.getElementById('kids').value);if(Number.isInteger(n)&&n>=1&&n<=30)adjustKids(n);else alert('Введите число от 1 до 30')">Продолжить</button>`}else if(page==='home'){h+=`<div class="hero"><h1>Ваш праздник начинается здесь ✨</h1><p>${state.kids} детей · выбирайте всё необходимое</p></div><div class="tabs">${[['child','🍟','Детский стол'],['adult','☕','Родители'],['fun','🎭','Развлечения'],['decor','🎈','Оформление']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;if(tab==='child'||tab==='adult'){table=tab;h+=`<div class="section">${tab==='child'?'🍟 Детский стол':'☕ Стол родителей'}</div>`+`<div class="actions"><button class="btn light" onclick="flow={type:'pizza'};go('pizzaSize')">🍕 Пицца</button><button class="btn light" onclick="flow={type:'nuggets'};go('quantity')">🍗 Наггетсы</button><button class="btn light" onclick="go('drinks')">🥤 Напитки</button></div>`;for(let i=0;i<snacks.length;i++){let x=snacks[i],id=tab+'|'+x[0],qty=state.cart[id]?.qty||0;h+=card(x[0],x[1],x[2],`flow={type:'snack',item:${i}};${x[3]==='linked'?"go('quantity')":`put('${id}','${x[0]}',${x[1]},1,'${tab}')`}`,qty)}}else{let arr=tab==='fun'?services:decor;h+=`<div class="section">${tab==='fun'?'🎭 Развлечения':'🎈 Оформление'}</div>`;arr.forEach((x,i)=>{let id=tab+'|'+x[0];h+=card(x[0],x[1],x[2],`selectService(${i})`,state.cart[id]?.qty||0)})}h+=`<button class="btn ghost wide" onclick="reset()">🔄 Начать заново</button>`}else if(page==='pizzaSize'){h+=`<button class="back" onclick="root()">← К столу</button>`+options('🍕 Выберите размер пиццы',[['25 см',700],['30 см',850]],'pizzaSize')}else if(page==='pizzaFlavor'){h+=`<button class="back" onclick="go('pizzaSize')">← Размер</button><h2>🍕 Пицца — ${flow.size} см</h2>`;flavors.forEach(f=>{let id=table+'|Пицца «'+f+'» '+flow.size+' см',q=state.cart[id]?.qty||0;h+=`<div class="card"><div class="line"><div class="name">${safe(f)}</div><span class="tag">${q} шт.</span></div><div class="actions"><button class="btn" onclick="put(${JSON.stringify(id)},${JSON.stringify('Пицца «'+f+'» '+flow.size+' см')},${flow.price},1,'${table}')">➕ Добавить</button><button class="btn danger" ${!q?'disabled':''} onclick="change(${JSON.stringify(id)},-1)">➖ Убрать</button></div></div>`});h+=`<button class="btn light wide" onclick="root()">Продолжить выбор</button>`}else if(page==='quantity'){let t=flow.type;h+=`<button class="back" onclick="root()">← К столу</button><h2>Сколько ${t==='nuggets'?'порций наггетсов':t==='snack'?'порций':'упаковок'}?</h2><button class="choice" onclick="quantityChoice(${state.kids},true)">По количеству детей — ${state.kids}</button><button class="choice" onclick="go('manual')">Указать своё количество</button>`}else if(page==='manual'){h+=`<button class="back" onclick="go('quantity')">← Назад</button><h2>Введите количество (от 1 до 50)</h2><input id="manual" type="number" min="1" max="50" inputmode="numeric" class="input" placeholder="1–50"><button class="btn wide" onclick="let n=Number(document.getElementById('manual').value);if(Number.isInteger(n)&&n>=1&&n<=50)quantityChoice(n,false);else alert('Введите число от 1 до 50')">Продолжить</button>`}else if(page==='nuggetSize'){h+=`<button class="back" onclick="go('quantity')">← Количество</button>`+options('🍗 Сколько наггетсов в порции?',[['2 шт.',80],['4 шт.',120],['6 шт.',150]],'nuggetSize')}else if(page==='drinks'){h+=`<button class="back" onclick="root()">← К столу</button><h2>🥤 Напитки</h2>`+`<button class="choice" onclick="flow={type:'juice'};go('juiceSize')">🧃 Сок</button><button class="choice" onclick="flow={type:'water'};go('waterSize')">💧 Вода</button>`;h+=card('Чай в чашке',80,'180 мл',`put('${table}|Чай в чашке','Чай в чашке, 180 мл',80,1,'${table}')`,state.cart[table+'|Чай в чашке']?.qty||0);if(table==='adult'){h+=card('Чай в чайничке',300,'900 мл',`put('adult|Чай в чайничке','Чай в чайничке, 900 мл',300,1,'adult')`,state.cart['adult|Чай в чайничке']?.qty||0);h+=`<button class="choice" onclick="go('coffee')">☕ Кофе — выбрать вид</button>`}h+=`<button class="btn light wide" onclick="root()">Продолжить выбор</button>`}else if(page==='coffee'){h+=`<button class="back" onclick="go('drinks')">← Напитки</button><h2>☕ Кофе</h2>`;[['Эспрессо',75,'60 мл'],['Американо',120,'180 мл'],['Капучино',150,'180 мл'],['Латте',200,'300 мл'],['Глясе',180,'180 мл']].forEach(x=>{let id='adult|'+x[0];h+=card(x[0],x[1],x[2],`put(${JSON.stringify(id)},${JSON.stringify(x[0])},${x[1]},1,'adult')`,state.cart[id]?.qty||0)})}else if(page==='juiceSize'||page==='waterSize'){let juice=page==='juiceSize';h+=`<button class="back" onclick="go('drinks')">← Напитки</button>`+options(juice?'🧃 Объём сока':'💧 Объём воды',juice?[['0,2 л',60],['1 л',250]]:[['0,5 л',60],['1,5 л',120]],juice?'juiceSize':'waterSize')}else if(page==='juiceFlavor'||page==='waterFlavor'){let juice=page==='juiceFlavor',arr=juice?juices:['Газированная','Негазированная'];h+=`<button class="back" onclick="go('${juice?'juiceSize':'waterSize'}')">← Объём</button><h2>${juice?'🧃 Сок':'💧 Вода'} — ${flow.vol}</h2>`;arr.forEach((f,i)=>{let name=(juice?'Сок ':'Вода ')+f.toLowerCase()+', '+flow.vol,id=table+'|'+name,q=state.cart[id]?.qty||0;h+=`<div class="card"><div class="line"><div class="name">${safe(f)}</div><span class="tag">${q} шт.</span></div><div class="actions"><button class="btn" onclick="addDrink(${i})">➕ ${flow.small&&flow.initialQty?'Добавить '+flow.initialQty:'Добавить 1'}</button><button class="btn danger" ${q?'':'disabled'} onclick="change(${JSON.stringify(id)},-1)">➖ Убрать 1</button></div></div>`});h+=`<button class="btn light wide" onclick="root()">Продолжить выбор</button>`}else if(page==='cart'){h+=`<h2>🧾 Моя смета</h2>`;let groups=[['child','🍟 Детский стол'],['adult','☕ Стол родителей'],['fun','🎭 Развлечения'],['decor','🎈 Оформление']];if(!keys().length)h+=`<div class="empty">Пока ничего не выбрано 🌸</div>`;groups.forEach(g=>{let list=Object.values(state.cart).filter(x=>x.kind===g[0]);if(!list.length)return;h+=`<div class="section">${g[1]}</div>`;list.forEach(x=>{h+=`<div class="card"><div class="line"><div><div class="name">${safe(x.name)}</div><div class="sub">${x.qty} ${x.unit||'шт.'} × ${money(x.price)}${x.blocks&&x.blocks>1?' × '+x.blocks+' периодов':''}</div></div><div class="price">${money(x.qty*x.price*(x.blocks||1))}</div></div></div>`})});h+=`<div class="card"><div class="line"><b>Итого</b><div class="total">${money(total())}</div></div></div><div class="actions"><button class="btn light" onclick="go('editlist')">✏️ Изменить смету</button><button class="btn light" onclick="root()">➕ Добавить</button></div><div class="actions"><button class="btn ghost" onclick="go('changeKids')">👧 Изменить число детей</button><button class="btn danger" onclick="reset()">🔄 Начать заново</button></div><button class="btn wide" onclick="go('request')">📨 Оформить заявку</button>`}else if(page==='editlist'){h+=`<button class="back" onclick="go('cart')">← К смете</button><h2>✏️ Что изменить?</h2>`;if(!keys().length)h+=`<div class="empty">Смета пуста</div>`;keys().forEach(id=>{let x=state.cart[id];h+=`<button class="choice" onclick="editItem(${JSON.stringify(id)})">${safe(x.name)} <small>${x.qty} шт.</small></button>`})}else if(page==='edititem'){let x=state.cart[editing];if(!x){go('editlist');return}h+=`<button class="back" onclick="go('editlist')">← К позициям</button><h2>${safe(x.name)}</h2><div class="card"><div class="muted">${money(x.price)} за единицу</div><div class="qtyline" style="margin-top:18px"><button class="btn light" onclick="change(${JSON.stringify(editing)},-1)">➖</button><strong style="font-size:24px">${x.qty} ${x.unit||'шт.'}</strong><button class="btn light" onclick="change(${JSON.stringify(editing)},1)">➕</button></div><h2 style="text-align:center">${money(x.qty*x.price*(x.blocks||1))}</h2>${x.blocks?`<div class="actions"><button class="btn ghost" onclick="changeBlocks(-1)">⏱ −30 мин</button><button class="btn ghost" onclick="changeBlocks(1)">⏱ +30 мин</button></div>`:''}</div><button class="btn danger wide" onclick="deleteItem()">Удалить позицию</button><button class="btn light wide" style="margin-top:10px" onclick="go('cart')">К смете</button>`}else if(page==='changeKids'){h+=`<button class="back" onclick="go('cart')">← К смете</button><h2>👧 Изменить количество детей</h2><input id="kids" class="input" type="number" min="1" max="30" inputmode="numeric" value="${state.kids}"><button class="btn wide" onclick="let n=Number(document.getElementById('kids').value);if(Number.isInteger(n)&&n>=1&&n<=30)adjustKids(n);else alert('Введите число от 1 до 30')">Сохранить и вернуться к смете</button><div class="notice">Позиции, выбранные «по количеству детей», будут пересчитаны. Ручные количества не изменятся.</div>`}else if(page==='confirmreset'){h+=`<h2>🔄 Начать заново?</h2><p>Вся смета и количество детей будут сброшены.</p><button class="btn danger wide" onclick="state={kids:0,cart:{}};persist();go('welcome')">Да, всё сбросить</button><button class="btn ghost wide" style="margin-top:10px" onclick="go('cart')">Нет, вернуться</button>`}else if(page==='request'){h+=`<button class="back" onclick="go('cart')">← К смете</button><h2>📨 Оформить заявку</h2><label>Ваше имя<input id="customer" class="input" placeholder="Имя" autocomplete="name"></label><label>Телефон<input id="phone" class="input" placeholder="+7 ..." type="tel" autocomplete="tel"></label><button class="btn wide" onclick="alert('Это демонстрация. Заявка не отправлена. Для реальной отправки потребуется подключить сервер и Telegram-бота.')">Отправить заявку</button><div class="notice">Демонстрационный режим: данные не отправляются и не сохраняются на сервере.</div>`}else if(page==='programAge'){h+=`<button class="back" onclick="root()">← Развлечения</button>`+options('🎭 Возрастная группа',Object.keys(programs).map(x=>[x,0]),'programAge')}else if(page==='programTheme'){h+=`<button class="back" onclick="go('programAge')">← Возраст</button><h2>🎭 Выберите программу</h2>`;programs[flow.age].forEach((name,i)=>h+=`<button class="choice" onclick="programTheme(${i})">${safe(name)}</button>`)}else if(page==='playQuantity'){h+=`<button class="back" onclick="root()">← Развлечения</button><h2>🎠 Игровая комната</h2><button class="choice" onclick="playSet(${state.kids})">Все дети — ${state.kids}</button><input id="manual" type="number" min="1" max="50" class="input" placeholder="Или укажите количество (1–50)"><button class="btn wide" onclick="let n=Number(document.getElementById('manual').value);if(n>=1&&n<=50&&Number.isInteger(n))playSet(n);else alert('Введите от 1 до 50')">Добавить</button>`}document.getElementById('app').innerHTML=h;foot()}
function pizzaSize(i){flow.size=i===0?25:30;flow.price=i===0?700:850;go('pizzaFlavor')}function quantityChoice(n,linked){flow.qty=n;flow.linked=linked;if(flow.type==='nuggets'){go('nuggetSize');return}if(flow.type==='snack'){let x=snacks[flow.item];put(table+'|'+x[0],x[0],x[1],n,table,linked);root();return}if(flow.type==='juice'||flow.type==='water'){flow.initialQty=n;go(flow.type==='juice'?'juiceFlavor':'waterFlavor')}}function nuggetSize(i){let prices=[80,120,150],sizes=[2,4,6],name='Наггетсы '+sizes[i]+' шт. в порции';put(table+'|'+name,name,prices[i],flow.qty,table,flow.linked,{unit:'порц.'});root()}function juiceSize(i){flow.vol=i?'1 л':'0,2 л';flow.price=i?250:60;flow.small=!i;flow.initialQty=1;if(!i)go('quantity');else go('juiceFlavor')}function waterSize(i){flow.vol=i?'1,5 л':'0,5 л';flow.price=i?120:60;flow.small=!i;flow.initialQty=1;if(!i)go('quantity');else go('waterFlavor')}function addDrink(i){let juice=flow.type==='juice',f=juice?juices[i]:['Газированная','Негазированная'][i],name=(juice?'Сок ':'Вода ')+f.toLowerCase()+', '+flow.vol,id=table+'|'+name;put(id,name,flow.price,flow.initialQty||1,table,!!flow.linked&&!(state.cart[id]?.qty),{unit:'шт.'});flow.initialQty=1;flow.linked=false}function selectService(i){if(tab==='decor'){let x=decor[i];put('decor|'+x[0],x[0],x[1],1,'decor');return}let x=services[i];if(x[3]==='play'){go('playQuantity');return}if(i===0){go('programAge');return}put('fun|'+x[0],x[0],x[1],1,'fun',false,x[3]==='hours'?{unit:'ч.'}:{})}function programAge(i){flow.age=Object.keys(programs)[i];go('programTheme')}function programTheme(i){let name='Анимационная программа — '+programs[flow.age][i];put('fun|'+name,name,4500,1,'fun',false,{unit:'ч.'});root()}function playSet(n){let id='fun|Игровая комната',x=state.cart[id];if(x){x.qty=n}else state.cart[id]={id,name:'Игровая комната',price:150,qty:n,kind:'fun',unit:'чел.',blocks:1};persist();root()}function editItem(id){editing=id;go('edititem')}function deleteItem(){delete state.cart[editing];persist();go('editlist')}function changeBlocks(d){let x=state.cart[editing];if(x){x.blocks=Math.max(1,(x.blocks||1)+d);persist();render()}}try{render()}catch(err){document.getElementById('app').innerHTML='<h2>Не удалось открыть прототип</h2><p>'+String(err.message||err)+'</p>';console.error(err)};
</script></body></html>
